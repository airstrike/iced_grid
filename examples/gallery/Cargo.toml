[package]
name = "gallery"
version = "0.1.0"
authors = [
    "Héctor Ramón Jiménez <hector0193@gmail.com>",
    "Andy Terra <spam@andyterra.com>",
]
edition = "2024"
publish = false

[dependencies]
iced = { workspace = true, features = [
    "tokio",
    "image",
    "web-colors",
    "debug",
    "wgpu",
] }
iced_grid = { path = "../.." }

reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }

bytes = "1.6"
image = { version = "0.25", default-features = false }
sipper = "0.1"
tokio = "1.0"

blurhash = "0.2.3"
